---
name: 🧪 CI - Check
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  check:
    name: 🧪 Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Env & Deps
        uses: ./.github/actions/env-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Lint
        uses: ./.github/actions/lint

      - name: Type check
        run: pnpm typecheck

      - name: Frontend Tests with Coverage
        run: pnpm test -- --coverage

      - name: Build Verification
        run: pnpm vite:build

      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Rust Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Env & Deps
        uses: ./.github/actions/env-deps

      # The npmmirror registry in .npmrc has no audit endpoint; query the npm registry.
      - name: npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
        env:
          npm_config_registry: https://registry.npmjs.org/
          pnpm_config_registry: https://registry.npmjs.org/

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Cargo deny
        working-directory: src-tauri
        run: cargo deny check

  pr-title:
    name: 📝 PR Title Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Conventional commit PR title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017  # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Non-blocking: needs the repo Dependency Graph enabled. Rust deps are
      # already gated by cargo-deny + cargo-audit, npm by pnpm audit above.
      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4.7.1
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
