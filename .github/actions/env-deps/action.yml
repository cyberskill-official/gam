---
name: Env & Deps
description: Set up pnpm (version from package.json packageManager) and Node from .nvmrc, then install dependencies with a frozen lockfile.

runs:
  using: composite
  steps:
    # .npmrc points at registry.npmmirror.com for local installs; CI uses the npm registry.
    # pnpm 11 reads pnpm_config_*; npm and the action's bootstrap pnpm 8 read npm_config_*.
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
      env:
        npm_config_registry: https://registry.npmjs.org/
        pnpm_config_registry: https://registry.npmjs.org/

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        npm_config_registry: https://registry.npmjs.org/
        pnpm_config_registry: https://registry.npmjs.org/
